[project]
name = "hermes-kanban-sqlite"
version = "0.1.0"
description = "SQLite-backed Kanban CLI/TUI (non-Obsidian) — standalone terminal interface for kanban boards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.47",
    "click>=8.1",
]

[project.scripts]
hermes-kanban-sqlite = "hermes_kanban_sqlite.cli:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
